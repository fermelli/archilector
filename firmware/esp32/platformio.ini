; ArchiLector · Firmware del ESP32 (alternativa B, rodillos Canon FB6-3405)
; Documento Técnico v2.2, sección 4 (bloque B2) y sección 8 (protocolo P1).
;
;   pio run                               -> compila el firmware principal
;   pio run -t upload                     -> lo graba en el ESP32
;   pio run -e prueba_salidas -t upload   -> firmware de la prueba T2.3
;   pio device monitor                    -> monitor serie a 115200

[platformio]
default_envs = archilector

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D CORE_DEBUG_LEVEL=0        ; sin mensajes de depuración en UART0: es el enlace con la Pi
    -Wall

[env:archilector]

[env:prueba_salidas]
; T2.3: activa cada salida por turno y hace girar el motor en ambos sentidos.
build_flags =
    ${env.build_flags}
    -D PRUEBA_SALIDAS
