# ArchiLector · configuración (se copia a config.yaml). Solo hace falta poner
# lo que cambia; el resto toma los valores de archilector/config.py.

datos: datos                      # imágenes, PDF, pares de entrenamiento y base de datos

enlace:
  puerto: /dev/archilector-esp32  # regla udev (deploy/99-archilector.rules); "sim://" para simular

camara:
  fuente: auto                    # auto | pi | webcam[:<n>|:<ruta>] | sim | carpeta:<ruta>
                                  # auto: la última elegida en el panel; si no, la CSI; si no, la webcam
  pi: {ancho: 2592, alto: 1944}   # cámara V1.3 por CSI
  webcam: {ancho: 1280, alto: 720, asentar_s: 0.5}   # Redragon GW600 (720p); asentar_s: espera tras la luz
  # region_canto: {webcam: [0.05, 0.2, 0.2, 0.8]}   # si la webcam encuadra distinto que la CSI
  luz_captura: 100                # % de la tira LED al fotografiar (figura 8.2)
  luz_reposo: 30

ocr:
  motor: hibrido                  # rapidocr (defecto) | tesseract | hibrido
                                  # hibrido: Tesseract (acentos, ~3-6 s) y RapidOCR solo si Tesseract duda
                                  # requiere: sudo apt install tesseract-ocr tesseract-ocr-spa
  # min_palabras_confiables: 12   # menos palabras seguras que esto = "no hay página legible"
  # umbral_respaldo: 0.70         # confianza media bajo la cual el híbrido consulta a RapidOCR
  claude:                         # Claude lee cada página; sin internet o sin clave, el motor de arriba
    activo: false                 # requiere: pip install anthropic y ANTHROPIC_API_KEY en pi/.env
    modelo: claude-haiku-5-5      # claude-haiku-5-5 | claude-sonnet-5-5 | claude-opus-5-5 (también en Calibración)

vision:
  lado_pagina: ambas              # ambas: izquierda y luego derecha, de la misma foto | derecha (alcance 1.4)
  region_canto: [0.0, 0.2, 0.15, 0.8]   # canto de las hojas pasadas en la foto: ajustar tras el montaje
  paso_numeracion: 1              # avance del número impreso por página leída (2 con «derecha»)

ia:
  modelo_verificador: modelos/verificador.tflite    # se copian desde Colab
  modelo_clasificador: modelos/clasificador.tflite
  umbral_confianza: 0.80          # sección 4.5; ajustar con los datos de validación
  umbral_regla_pixeles: 0.03      # respaldo sin modelo; calibrar con los pares reales

volteo:
  reintentos: 2
  pasos_extra_retry: 40

lectura:
  avance_automatico: true         # false: espera «siguiente» al terminar cada página
  adelantar: true                 # pasa la hoja y lee la siguiente mientras habla (sin silencio entre páginas)
  saltar_blancas: true

voz:
  piper_modelo: modelos/voz/es_ES-davefx-medium.onnx
  vosk_modelo: modelos/vosk-model-small-es-0.42
  volumen: 70
  # microfono: [REDRAGON, USB]    # fragmentos del nombre (arecord -l) en orden de preferencia:
                                  # la webcam primero y, si no está, el micrófono USB

web:
  puerto: 8000
