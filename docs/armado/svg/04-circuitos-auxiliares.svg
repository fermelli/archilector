<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="1200" height="1010" font-family="Arial, Helvetica, sans-serif">
  <style>
    text { fill: #1d2330; font-size: 14px; }
    .t { font-size: 22px; font-weight: 700; }
    .st { font-size: 14px; fill: #5b6472; }
    .h { font-size: 16px; font-weight: 700; }
    .b { font-weight: 700; }
    .s { font-size: 13px; fill: #3f4652; }
    .pin { font-size: 13px; font-weight: 700; font-family: Consolas, "Courier New", monospace; }
    .marco { fill: #fbfcfd; stroke: #c9ced6; stroke-width: 1.5; }
    .caja { fill: #ffffff; stroke: #1d2330; stroke-width: 1.5; }
    .w { stroke: #1d2330; stroke-width: 2; fill: none; }
    .v5 { stroke: #d32f2f; stroke-width: 2.5; fill: none; }
    .v33 { stroke: #ef7d00; stroke-width: 2.5; fill: none; }
    .sda { stroke: #1f5fbf; stroke-width: 2.5; fill: none; }
    .scl { stroke: #2e7d32; stroke-width: 2.5; fill: none; }
    .gnd { stroke: #1d2330; stroke-width: 2.5; fill: none; }
    .r { fill: #ffffff; stroke: #1d2330; stroke-width: 2; }
    .nodo { fill: #1d2330; }
  </style>
  <defs>
    <g id="tierra"><path d="M-13 0 H13 M-8 5 H8 M-3 10 H3" stroke="#1d2330" stroke-width="2"/></g>
  </defs>
  <rect width="1200" height="1010" fill="#ffffff"/>
  <text x="30" y="40" class="t">Circuitos auxiliares de la placa de control (Documento Técnico, tabla 4.4)</text>
  <text x="30" y="64" class="st">Se sueldan en la misma placa perforada del ESP32. Resistencias de 1/4 W.</text>

  <!-- ============ (a) ILUMINACIÓN ============ -->
  <g transform="translate(20,90)">
    <rect width="570" height="400" rx="10" class="marco"/>
    <text x="15" y="30" class="h">(a) Iluminación: sin tira LED desde v2.3</text>
    <rect x="15" y="50" width="540" height="150" rx="8" fill="#fffbe6" stroke="#b38600" stroke-width="1.5"/>
    <text x="30" y="78" class="b">Lámpara de escritorio fija</text>
    <text x="30" y="102">• A un costado del libro, inclinada unos 45°,</text>
    <text x="42" y="122">para que su reflejo no caiga dentro de la foto.</text>
    <text x="30" y="148">• Luz blanca y siempre en la misma posición:</text>
    <text x="42" y="168">sin buena luz el OCR lee peor (prueba T4.4).</text>
    <text x="30" y="190" class="s">No se conecta a la placa: tiene su propio enchufe.</text>
    <text x="15" y="238" class="b">En la placa</text>
    <text x="15" y="262" class="s">• GPIO 27 queda libre y no se suelda nada en ese pin.</text>
    <text x="15" y="284" class="s">• No se compran el IRLZ44N ni sus resistencias de 100 Ω y 100 kΩ.</text>
    <text x="15" y="306" class="s">• El comando LIGHT se conserva: el ESP32 responde ACK y no hace nada visible.</text>
    <text x="15" y="346" class="s">Si más adelante se monta una tira LED de 5 V: GPIO27 → 100 Ω → compuerta</text>
    <text x="15" y="366" class="s">del IRLZ44N (100 kΩ a GND); drenador al (−) de la tira, fuente a GND,</text>
    <text x="15" y="386" class="s">(+) de la tira a +5 V. Suma unos 0,6 A a la rama de actuadores.</text>
  </g>

  <!-- ============ (b) BUZZER ============ -->
  <g transform="translate(610,90)">
    <rect width="570" height="400" rx="10" class="marco"/>
    <text x="15" y="30" class="h">(b) Buzzer: GPIO4 → 2N2222</text>
    <path d="M295 40 H425" class="v5"/><text x="432" y="45" class="b" style="fill:#d32f2f">+5 V</text>
    <path d="M295 40 V62" class="v5"/>
    <rect x="235" y="62" width="120" height="46" rx="6" fill="#fffbe6" stroke="#b38600" stroke-width="1.5"/>
    <text x="295" y="82" text-anchor="middle" class="b">Buzzer</text>
    <text x="295" y="99" text-anchor="middle" class="s">activo, 5 V</text>
    <text x="300" y="58" class="s">(+)</text><text x="300" y="124" class="s">(−)</text>
    <path d="M295 108 V182" class="w"/>
    <circle cx="295" cy="150" r="3.5" class="nodo"/>
    <!-- diodo -->
    <path d="M295 150 H420 V130 M420 108 V40" class="w"/>
    <polygon points="409,130 431,130 420,111" fill="#ffffff" stroke="#1d2330" stroke-width="2"/>
    <path d="M408 109 H432" stroke="#1d2330" stroke-width="3"/>
    <text x="440" y="118" class="b">1N4148</text><text x="440" y="135" class="s">franja hacia +5 V</text>
    <!-- NPN -->
    <circle cx="288" cy="210" r="38" fill="none" stroke="#5b6472" stroke-width="1.5"/>
    <path d="M272 188 V232" stroke="#1d2330" stroke-width="3"/>
    <path d="M272 200 L295 182" class="w"/>
    <path d="M272 220 L295 238 V300" class="w"/>
    <polygon points="295,238 283,236 289,228" fill="#1d2330"/>
    <text x="303" y="178" class="b">C</text><text x="250" y="204" class="b">B</text><text x="303" y="252" class="b">E</text>
    <text x="335" y="205" class="b">2N2222</text><text x="335" y="222" class="s">NPN, TO-92</text>
    <use href="#tierra" x="295" y="302"/>
    <!-- base -->
    <text x="12" y="215" class="pin">GPIO4</text>
    <path d="M62 210 H85" class="w"/>
    <rect x="85" y="203" width="45" height="14" class="r"/><text x="107" y="196" text-anchor="middle" class="s">1 kΩ</text>
    <path d="M130 210 H272" class="w"/>
    <!-- notas -->
    <text x="335" y="262" class="s">• BEEP 1: corto · 2: largo ·</text>
    <text x="345" y="279" class="s">3: tres largos (tabla 7.3).</text>
    <text x="335" y="302" class="s">• El diodo absorbe el pico</text>
    <text x="345" y="319" class="s">de tensión al apagar.</text>
    <text x="15" y="365" class="s">El orden de patas E · B · C del 2N2222 cambia según el fabricante (PN2222A, P2N2222A…):</text>
    <text x="15" y="383" class="s">verifíquelo en la hoja de datos del que compre antes de soldar.</text>
  </g>

  <!-- ============ (c) TECLADO ============ -->
  <g transform="translate(20,510)">
    <rect width="570" height="400" rx="10" class="marco"/>
    <text x="15" y="30" class="h">(c) Teclado 4×4: pull-ups externos en las columnas</text>
    <path d="M160 60 H470" class="v33"/><text x="478" y="65" class="b" style="fill:#c25e00">3V3</text>
    <g>
      <path d="M180 60 V75 M260 60 V75 M340 60 V75 M420 60 V75" class="v33"/>
      <rect x="173" y="75" width="14" height="42" class="r"/><rect x="253" y="75" width="14" height="42" class="r"/>
      <rect x="333" y="75" width="14" height="42" class="r"/><rect x="413" y="75" width="14" height="42" class="r"/>
      <path d="M180 117 V230 M260 117 V230 M340 117 V230 M420 117 V230" class="w"/>
      <circle cx="180" cy="150" r="3.5" class="nodo"/><circle cx="260" cy="150" r="3.5" class="nodo"/>
      <circle cx="340" cy="150" r="3.5" class="nodo"/><circle cx="420" cy="150" r="3.5" class="nodo"/>
      <path d="M180 150 H195 M260 150 H275 M340 150 H355 M420 150 H435" class="w"/>
    </g>
    <text x="110" y="100" class="s">4 × 10 kΩ</text>
    <g class="pin"><text x="198" y="146">G34</text><text x="278" y="146">G35</text><text x="358" y="146">G36</text><text x="438" y="146">G39</text></g>
    <rect x="140" y="230" width="320" height="140" rx="8" class="caja"/>
    <g class="pin"><text x="172" y="250">C1</text><text x="252" y="250">C2</text><text x="332" y="250">C3</text><text x="412" y="250">C4</text></g>
    <text x="300" y="350" text-anchor="middle" class="b">Teclado 4×4 de membrana</text>
    <path d="M140 270 H75 M140 298 H75 M140 326 H75 M140 354 H75" class="w"/>
    <g class="pin" text-anchor="end"><text x="70" y="275">F1·G13</text><text x="70" y="303">F2·G16</text><text x="70" y="331">F3·G17</text><text x="70" y="359">F4·G23</text></g>
    <text x="150" y="275" class="s">filas: salidas,</text><text x="150" y="292" class="s">una en bajo a la vez</text>
    <text x="15" y="392" class="s">GPIO 34–39 no tienen pull-up interno: sin estas resistencias el teclado no funciona.</text>
  </g>

  <!-- ============ (d) ENTRADA DE ALIMENTACIÓN ============ -->
  <g transform="translate(610,510)">
    <rect width="570" height="400" rx="10" class="marco"/>
    <text x="15" y="30" class="h">(d) Entrada de alimentación de la placa (sin bornera)</text>
    <!-- fuente -->
    <rect x="15" y="70" width="120" height="110" rx="6" class="caja"/>
    <text x="75" y="98" text-anchor="middle" class="b">Fuente ATX</text>
    <text x="75" y="118" text-anchor="middle" class="s">rojo +5 V</text>
    <text x="75" y="136" text-anchor="middle" class="s">negro GND</text>
    <text x="75" y="160" text-anchor="middle" class="s">esquema 13</text>
    <!-- fusible -->
    <path d="M135 95 H175" class="v5"/>
    <rect x="175" y="84" width="60" height="22" rx="3" class="r"/><path d="M181 95 H229" class="w" style="stroke-width:1.5"/>
    <text x="205" y="76" text-anchor="middle" class="b">Fusible 4 A</text>
    <path d="M235 95 H300" class="v5"/>
    <path d="M135 160 H300" class="gnd"/>
    <text x="250" y="88" class="s">C02</text><text x="250" y="153" class="s">C15</text>
    <!-- buses de la placa -->
    <path d="M300 95 H555" class="v5" style="stroke-width:5"/>
    <path d="M300 160 H555" class="gnd" style="stroke-width:5"/>
    <text x="430" y="85" text-anchor="middle" class="b" style="fill:#d32f2f">bus +5 V de la placa</text>
    <text x="430" y="182" text-anchor="middle" class="b">bus GND = tierra única</text>
    <!-- capacitor -->
    <path d="M330 95 V118" class="v5"/><path d="M314 118 H346" stroke="#1d2330" stroke-width="2.5"/>
    <path d="M314 128 Q330 121 346 128" stroke="#1d2330" stroke-width="2.5" fill="none"/><path d="M330 127 V160" class="gnd"/>
    <circle cx="330" cy="95" r="3.5" fill="#d32f2f"/><circle cx="330" cy="160" r="3.5" class="nodo"/>
    <text x="352" y="122" class="s">2200 µF ≥ 10 V</text><text x="352" y="138" class="s">franja (−) a GND</text>
    <!-- salidas -->
    <g class="s">
      <text x="15" y="225">Del bus +5 V y GND salen: servos (MG996R, SG90), ULN2003</text>
      <text x="15" y="243">y buzzer (por el 2N2222).</text>
      <text x="15" y="270">El GND del ESP32 se une al bus GND; el +5 V no toca su pin 5V/VIN.</text>
      <text x="15" y="297">Sin LCD, BSS138 ni tira LED en v2.3: GPIO 21, 22 y 27 libres.</text>
      <text x="15" y="324">• Medir T1.1–T1.3 en el bus antes de insertar el DevKit.</text>
      <text x="15" y="345">• Pistas o cables del bus en AWG 20 o más grueso (picos de 3,0 A).</text>
      <text x="15" y="366">• De la ATX solo rojo y negro; el amarillo (12 V) aislado.</text>
    </g>
  </g>

  <!-- ============ SERVOS ============ -->
  <rect x="20" y="925" width="1160" height="70" rx="10" class="marco"/>
  <text x="35" y="952" class="h">Conectores de servo (3 pines macho en la placa)</text>
  <rect x="470" y="934" width="30" height="24" fill="#d4a600"/><rect x="500" y="934" width="30" height="24" fill="#d32f2f"/><rect x="530" y="934" width="30" height="24" fill="#6d4c41"/>
  <text x="575" y="952">Señal (naranja) · +5 V (rojo) · GND (marrón).</text>
  <text x="35" y="978" class="s">Sin componentes: la señal de 3,3 V basta para MG996R y SG90. Si un servo tiembla, revisar la tierra común y el capacitor de la entrada.</text>
</svg>
