<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" width="1300" height="820" font-family="Arial, Helvetica, sans-serif">
  <style>
    text { fill: #1d2330; font-size: 14px; }
    .t { font-size: 22px; font-weight: 700; }
    .st { font-size: 14px; fill: #5b6472; }
    .b { font-weight: 700; }
    .s { font-size: 12.5px; fill: #3f4652; }
    .c { font-size: 13px; font-weight: 700; fill: #1d2330; }
    .caja { fill: #ffffff; stroke: #1d2330; stroke-width: 1.5; }
    .ctrl { fill: #eaf1fb; stroke: #1f5fbf; stroke-width: 2.5; }
    .mec { fill: #f4f5f7; stroke: #5b6472; stroke-width: 1.5; }
    .v5 { stroke: #d32f2f; stroke-width: 3; fill: none; }
    .gnd { stroke: #1d2330; stroke-width: 3; fill: none; }
    .sig { stroke: #5b6472; stroke-width: 2.5; fill: none; }
    .pwm { stroke: #d4a600; stroke-width: 3; fill: none; }
    .usb { stroke: #6a3fb5; stroke-width: 3; fill: none; }
    .i2c { stroke: #1f5fbf; stroke-width: 3; fill: none; }
  </style>
  <rect width="1300" height="820" fill="#ffffff"/>
  <text x="30" y="38" class="t">Interconexión completa: cables C01 a C20 (Documento Técnico 9.1 y 9.2)</text>
  <text x="30" y="62" class="st">Cada cable lleva en ambos extremos una etiqueta con su código. C06 queda reservado para los relés de la alternativa A.</text>

  <!-- fuente ATX directo a la placa (v2.3: sin bornera) -->
  <rect x="30" y="270" width="200" height="100" rx="8" class="caja"/>
  <text x="130" y="298" text-anchor="middle" class="b">Fuente ATX</text>
  <text x="130" y="318" text-anchor="middle" class="s">rojo +5 V y negro GND</text>
  <text x="130" y="336" text-anchor="middle" class="s">interruptor en PS_ON</text>
  <text x="130" y="354" text-anchor="middle" class="s">esquema 13</text>
  <path d="M230 300 H310" class="v5"/>
  <rect x="310" y="289" width="64" height="22" rx="3" fill="#fff" stroke="#1d2330" stroke-width="1.8"/>
  <path d="M316 300 H368" stroke="#1d2330" stroke-width="1.5"/>
  <text x="342" y="282" text-anchor="middle" class="s">fusible 4 A</text>
  <path d="M374 300 H530" class="v5"/><path d="M230 340 H530" class="gnd"/>
  <text x="270" y="290" text-anchor="middle" class="c">C01</text>
  <text x="450" y="292" text-anchor="middle" class="c">C02</text><text x="450" y="332" text-anchor="middle" class="c">C15</text>
  <text x="380" y="362" text-anchor="middle" class="s">AWG 18–20 · capacitor 2200 µF</text><text x="380" y="380" text-anchor="middle" class="s">en la entrada de la placa</text>

  <!-- placa -->
  <rect x="530" y="90" width="200" height="460" rx="12" class="ctrl"/>
  <text x="630" y="122" text-anchor="middle" class="b" style="font-size:16px">Placa de control</text>
  <text x="630" y="146" text-anchor="middle" class="s">ESP32 DevKit</text>
  <text x="630" y="164" text-anchor="middle" class="s">IRLZ44N · 2N2222</text>
  <text x="630" y="182" text-anchor="middle" class="s">pull-ups 10 kΩ</text>
  <text x="630" y="200" text-anchor="middle" class="s">conectores de servos</text>
  <text x="630" y="420" text-anchor="middle" class="s">GND de la placa =</text>
  <text x="630" y="438" text-anchor="middle" class="s">punto único de tierra</text>

  <!-- salidas de la placa -->
  <g>
    <path d="M730 115 H870" class="pwm"/><text x="800" y="107" text-anchor="middle" class="c">C07</text><text x="800" y="132" text-anchor="middle" class="s">3 · conector servo</text>
    <rect x="870" y="92" width="200" height="46" rx="6" class="mec"/><text x="882" y="113" class="b">MG996R · brazos</text><text x="882" y="130" class="s">GPIO18</text>

    <path d="M730 175 H870" class="pwm"/><text x="800" y="167" text-anchor="middle" class="c">C08</text><text x="800" y="192" text-anchor="middle" class="s">3 · conector servo</text>
    <rect x="870" y="152" width="200" height="46" rx="6" class="mec"/><text x="882" y="173" class="b">SG90 · barra</text><text x="882" y="190" class="s">GPIO19</text>

    <path d="M730 235 H870" class="sig"/><text x="800" y="227" text-anchor="middle" class="c">C09</text><text x="800" y="252" text-anchor="middle" class="s">6 · Dupont</text>
    <rect x="870" y="212" width="200" height="46" rx="6" class="caja"/><text x="882" y="233" class="b">ULN2003</text><text x="882" y="250" class="s">GPIO 32, 33, 25, 26</text>
    <path d="M1070 235 H1120" class="sig"/><text x="1095" y="227" text-anchor="middle" class="c">C03</text>
    <rect x="1120" y="205" width="160" height="60" rx="6" class="mec"/><text x="1132" y="228" class="b">28BYJ-48</text><text x="1132" y="246" class="s">5 hilos, bucle de</text><text x="1132" y="260" class="s">holgura para 180°</text>

    <path d="M730 295 H870" class="sig"/><text x="800" y="287" text-anchor="middle" class="c">C14</text><text x="800" y="312" text-anchor="middle" class="s">2 · AWG 20</text>
    <rect x="870" y="272" width="200" height="46" rx="6" class="caja"/><text x="882" y="293" class="b">Tira LED</text><text x="882" y="310" class="s">drenador del MOSFET</text>

    <path d="M730 355 H870" class="sig"/><text x="800" y="347" text-anchor="middle" class="c">C13</text><text x="800" y="372" text-anchor="middle" class="s">2 · AWG 22</text>
    <rect x="870" y="332" width="200" height="46" rx="6" class="caja"/><text x="882" y="353" class="b">Buzzer</text><text x="882" y="370" class="s">colector del 2N2222</text>

    <rect x="870" y="392" width="200" height="46" rx="6" fill="none" stroke="#8a8f99" stroke-width="1.5" stroke-dasharray="5 4"/><text x="882" y="413" class="s">C10 y C11: sin uso en v2.3</text><text x="882" y="430" class="s">(sin LCD ni BSS138)</text>

    <path d="M730 475 H870" class="sig"/><text x="800" y="467" text-anchor="middle" class="c">C12</text><text x="800" y="492" text-anchor="middle" class="s">8 · cinta</text>
    <rect x="870" y="452" width="200" height="46" rx="6" class="caja"/><text x="882" y="473" class="b">Teclado 4×4</text><text x="882" y="490" class="s">filas y columnas</text>
  </g>

  <!-- Pi -->
  <path d="M630 550 V620" class="usb"/>
  <text x="642" y="580" class="c">C16</text><text x="642" y="598" class="s">USB con datos, ≤ 1 m</text>
  <rect x="530" y="620" width="200" height="120" rx="12" class="ctrl"/>
  <text x="630" y="650" text-anchor="middle" class="b" style="font-size:16px">Raspberry Pi 4</text>
  <text x="630" y="672" text-anchor="middle" class="s">2 GB, en la viga</text>
  <text x="630" y="692" text-anchor="middle" class="s">C04: ventilador</text>
  <text x="630" y="710" text-anchor="middle" class="s">(pines 4 y 14)</text>
  <rect x="30" y="650" width="180" height="60" rx="8" class="caja"/>
  <text x="120" y="676" text-anchor="middle" class="b">Fuente oficial Pi</text>
  <text x="120" y="694" text-anchor="middle" class="s">5,1 V · 3 A · USB-C</text>
  <path d="M210 680 H530" class="v5"/><text x="370" y="672" text-anchor="middle" class="c">C20</text><text x="370" y="698" text-anchor="middle" class="s">USB-C</text>

  <g>
    <path d="M730 640 H870" class="sig"/><text x="800" y="632" text-anchor="middle" class="c">C17</text><text x="800" y="657" class="s" text-anchor="middle">cinta CSI 15 cm</text>
    <rect x="870" y="618" width="200" height="44" rx="6" class="caja"/><text x="882" y="645" class="b">Cámara V1.3</text>
    <path d="M730 690 H870" class="usb"/><text x="800" y="682" text-anchor="middle" class="c">C18</text><text x="800" y="707" class="s" text-anchor="middle">USB</text>
    <rect x="870" y="668" width="200" height="44" rx="6" class="caja"/><text x="882" y="695" class="b">Micrófono USB</text>
    <path d="M730 735 H870" class="sig"/><text x="800" y="727" text-anchor="middle" class="c">C19</text><text x="800" y="752" class="s" text-anchor="middle">jack 3,5 + pines 2 y 6</text>
    <rect x="870" y="718" width="200" height="44" rx="6" class="caja"/><text x="882" y="745" class="b">PAM8403</text>
    <path d="M1070 740 H1120" class="sig"/><text x="1095" y="732" text-anchor="middle" class="c">C05</text>
    <rect x="1120" y="718" width="160" height="44" rx="6" class="mec"/><text x="1132" y="745" class="b">Parlante 3 W</text>
  </g>

  <rect x="30" y="420" width="430" height="190" rx="10" fill="#fff8e1" stroke="#b38600" stroke-width="1.5"/>
  <text x="45" y="445" class="b">Orden de conexión (Técnico 9.3)</text>
  <text x="45" y="470" class="s">1. Mecánica completa, sin nada eléctrico.</text>
  <text x="45" y="492" class="s">2. Fuente ATX y placa: C01, C02 y C15.</text>
  <text x="45" y="514" class="s">3. Actuadores: C07, C08, C09, C03, C13 y C14.</text>
  <text x="45" y="536" class="s">4. Interfaz: C12 (teclado).</text>
  <text x="45" y="558" class="s">5. Pi: C17, C16, C18, C19, C05 y C04.</text>
  <text x="45" y="580" class="s">6. Revisar polaridad, una sola tierra (C15), cables</text>
  <text x="58" y="598" class="s">lejos del brazo, holgura de C03, cinta CSI firme.</text>
</svg>
