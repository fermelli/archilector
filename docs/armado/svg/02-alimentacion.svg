<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Arial, Helvetica, sans-serif">
  <style>
    text { fill: #1d2330; font-size: 14px; }
    .t { font-size: 22px; font-weight: 700; }
    .st { font-size: 14px; fill: #5b6472; }
    .b { font-weight: 700; }
    .s { font-size: 12.5px; fill: #5b6472; }
    .caja { fill: #ffffff; stroke: #1d2330; stroke-width: 1.5; }
    .ctrl { fill: #eaf1fb; stroke: #1f5fbf; stroke-width: 2; }
    .v5 { stroke: #d32f2f; stroke-width: 3.5; fill: none; }
    .gnd { stroke: #1d2330; stroke-width: 3.5; fill: none; }
    .usb { stroke: #6a3fb5; stroke-width: 3; fill: none; }
    .fino { stroke: #1d2330; stroke-width: 1.5; fill: none; }
    .aviso { fill: #fff8e1; stroke: #b38600; stroke-width: 1.5; }
  </style>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="30" y="40" class="t">Bloque B1 · Alimentación: dos fuentes separadas y una sola tierra</text>
  <text x="30" y="64" class="st">Documento Técnico v2.3, sección 3 · rojo = +5 V · negro = GND · violeta = USB · corrientes estimadas (confirmar con T1.4)</text>

  <!-- ================= RAMA DE LA PI ================= -->
  <text x="30" y="104" class="b">Rama de la Raspberry Pi (2,2 A de 3 A)</text>
  <rect x="30" y="125" width="180" height="80" rx="8" class="caja"/>
  <text x="120" y="155" text-anchor="middle" class="b">Fuente oficial Pi</text>
  <text x="120" y="175" text-anchor="middle" class="s">5,1 V · 3 A · USB-C</text>
  <text x="120" y="193" text-anchor="middle" class="s">cable C20</text>
  <path d="M210 165 H290" class="v5"/>
  <polygon points="290,159 302,165 290,171" fill="#d32f2f"/>

  <rect x="302" y="110" width="270" height="160" rx="10" class="ctrl"/>
  <text x="437" y="140" text-anchor="middle" class="b">Raspberry Pi 4 (2 GB)</text>
  <text x="437" y="160" text-anchor="middle" class="s">~1,3 A con IA y OCR</text>
  <text x="437" y="185" text-anchor="middle" class="s">Ventilador 30 mm: pines 4 (5 V)</text><text x="437" y="201" text-anchor="middle" class="s">y 14 (GND) · cable C04</text>
  <text x="437" y="224" text-anchor="middle" class="s">Ningún 5 V de la Pi va a la fuente ATX</text>
  <text x="437" y="250" text-anchor="middle" class="s">USB-A (negro) → ESP32 · C16</text>

  <!-- periféricos de la Pi -->
  <g>
    <path d="M572 135 H700" class="fino"/>
    <rect x="700" y="115" width="250" height="40" rx="6" class="caja"/>
    <text x="712" y="140">Cámara V1.3 · CSI · C17</text><text x="938" y="140" text-anchor="end" class="s">0,25 A</text>
    <path d="M572 180 H700" class="usb"/>
    <rect x="700" y="160" width="250" height="40" rx="6" class="caja"/>
    <text x="712" y="185">Micrófono USB · C18</text><text x="938" y="185" text-anchor="end" class="s">0,1 A</text>
    <path d="M572 225 H700" class="v5"/>
    <rect x="700" y="205" width="250" height="40" rx="6" class="caja"/>
    <text x="712" y="230">PAM8403 · pines 2 y 6 · C19</text><text x="938" y="230" text-anchor="end" class="s">0,3 A</text>
    <path d="M950 225 H990" class="fino"/>
    <rect x="990" y="205" width="170" height="40" rx="6" class="caja"/>
    <text x="1002" y="230">Parlante 3 W · C05</text>
  </g>

  <!-- USB Pi -> placa (ESP32) -->
  <path d="M437 270 V300 H1080 V420" class="usb"/>
  <polygon points="1074,420 1080,432 1086,420" fill="#6a3fb5"/>
  <text x="600" y="292" class="s">C16 · USB con datos, ≤ 1 m: datos del ESP32 + su alimentación (0,25 A) + unión de tierra</text>

  <!-- ================= RAMA DE ACTUADORES ================= -->
  <text x="30" y="352" class="b">Rama de actuadores (1,4 A sostenido · pico 3,0 A · la fuente ATX da 15 a 25 A en +5 V)</text>

  <!-- fuente ATX -->
  <rect x="30" y="385" width="200" height="120" rx="8" class="caja"/>
  <text x="130" y="413" text-anchor="middle" class="b">Fuente ATX</text>
  <text x="130" y="431" text-anchor="middle" class="s">de computadora</text>
  <text x="130" y="453" text-anchor="middle" class="s">solo rojo (+5 V) y negro (GND)</text>
  <text x="130" y="471" text-anchor="middle" class="s">amarillo (12 V): aislado</text>
  <text x="130" y="489" text-anchor="middle" class="s">detalle en el esquema 13</text>
  <path d="M230 430 H430" class="v5"/>
  <path d="M230 470 H300 V560 H905" class="gnd"/>
  <text x="245" y="422" class="s">rojo +5 V</text>
  <text x="245" y="490" class="s">negro GND</text>

  <!-- interruptor PS_ON -->
  <path d="M130 505 V545" stroke="#2e9b4a" stroke-width="3" fill="none"/>
  <rect x="40" y="545" width="190" height="56" rx="6" class="caja"/>
  <circle cx="75" cy="573" r="5" fill="#fff" stroke="#1d2330" stroke-width="2"/>
  <circle cx="120" cy="573" r="5" fill="#fff" stroke="#1d2330" stroke-width="2"/>
  <path d="M79 570 L117 553" stroke="#1d2330" stroke-width="2.5"/>
  <text x="135" y="567" class="b" style="font-size:13px">Interruptor</text>
  <text x="135" y="585" class="s">verde ↔ negro</text>
  <text x="40" y="620" class="s">enciende la fuente = corta los actuadores</text>

  <!-- fusible -->
  <rect x="430" y="418" width="70" height="24" rx="3" fill="#fff" stroke="#1d2330" stroke-width="1.8"/>
  <path d="M436 430 H494" stroke="#1d2330" stroke-width="1.5"/>
  <text x="465" y="408" text-anchor="middle" class="b">Fusible 4 A</text>
  <text x="465" y="462" text-anchor="middle" class="s">portafusible · obligatorio</text>
  <path d="M500 430 H905" class="v5"/>
  <text x="560" y="422" class="s">C01 + C02 · AWG 18 rojo</text>
  <text x="560" y="552" class="s">C01 + C15 · AWG 18 negro</text>

  <!-- capacitor en la entrada de la placa -->
  <path d="M850 430 V478" class="v5"/>
  <path d="M832 478 H868" stroke="#1d2330" stroke-width="3"/>
  <path d="M832 490 Q850 482 868 490" stroke="#1d2330" stroke-width="3" fill="none"/>
  <path d="M850 488 V560" class="gnd"/>
  <text x="640" y="476" class="b">C 2200 µF · ≥ 10 V</text>
  <text x="640" y="494" class="s">soldado en la entrada</text>
  <text x="640" y="510" class="s">de la placa; franja (−) a GND</text>

  <!-- placa de control -->
  <rect x="905" y="395" width="275" height="190" rx="10" class="ctrl"/>
  <text x="1042" y="423" text-anchor="middle" class="b">Placa de control</text>
  <text x="1042" y="443" text-anchor="middle" class="s">ESP32 DevKit (por USB desde la Pi)</text>
  <text x="1042" y="470" text-anchor="middle" class="s">entrada única: +5 V (C02) y GND (C15)</text>
  <text x="1042" y="490" text-anchor="middle" class="s">reparte +5 V y GND a cada conector</text>
  <text x="1042" y="520" text-anchor="middle" class="b" style="font-size:13px">GND de la placa =</text>
  <text x="1042" y="538" text-anchor="middle" class="b" style="font-size:13px">punto único de tierra</text>
  <text x="1042" y="566" text-anchor="middle" class="s">el +5 V no toca el pin 5V/VIN</text>

  <!-- cargas -->
  <rect x="690" y="620" width="490" height="120" rx="8" class="caja"/>
  <text x="705" y="645" class="b">Cargas alimentadas desde la placa (AWG 20–22)</text>
  <text x="705" y="668">MG996R brazos · 0,9 A (pico 2,5 A)</text>
  <text x="705" y="688">SG90 barra · 0,25 A (pico 0,65 A)</text>
  <text x="705" y="708">28BYJ-48 + ULN2003 · 0,24 A</text>
  <text x="950" y="668">Buzzer · 0,03 A</text>
  <text x="950" y="688" class="s">Sin tira LED en v2.3</text>
  <text x="705" y="730" class="s">Si la tensión oscila o la ATX se apaga sola: 10 Ω 5 W entre +5 V y GND.</text>

  <!-- reglas -->
  <rect x="30" y="640" width="640" height="100" rx="8" class="aviso"/>
  <text x="45" y="662" class="b">Reglas (sección 1.4) y pruebas antes de conectar cargas</text>
  <text x="45" y="682">• Ningún motor ni servo se alimenta desde el 5 V o el 3,3 V del ESP32 o de la Pi.</text>
  <text x="45" y="700">• Una sola tierra: el GND de la placa. No unir la Pi a ese punto con otro cable.</text>
  <text x="45" y="718">• De la ATX solo rojo y negro; el amarillo (12 V) se aísla. Todo con la fuente apagada.</text>
  <text x="45" y="736">• T1.1: 4,9–5,25 V en vacío · T1.2: sin corto · T1.3: ≥ 4,8 V con 2,2 Ω 15 W por 1 min.</text>
</svg>
